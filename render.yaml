# Render deployment for the Quicker Portal account service.
#
# Persistent application state lives in MongoDB Atlas when MONGODB_URI is set.
# The service therefore does not depend on Render's ephemeral filesystem for
# users, sessions, subscriptions, MCP state, OAuth state, audit events, or
# transmission analytics. Keep the Atlas URI in Render's secret environment;
# never commit it to this file.
services:
  - type: web
    name: qp-desktop-backend
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: quicker_portal
      # Optional hardening: QP_SIGNING_SECRET may be added manually in Render.
      # If omitted, QP generates a signing-key set once and persists it in MongoDB.
      # Render routes external traffic to this port and terminates TLS in front
      # of it, so binding to all interfaces here is expected.
      - key: QP_BACKEND_HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      # Set to 1 only because Render's proxy sets X-Forwarded-For. Without a
      # trusted proxy in front, clients could spoof their rate-limit identity.
      - key: QP_BACKEND_TRUST_PROXY
        value: "1"
      # The public origin used to build MCP endpoints and the OAuth issuer.
      - key: QP_MCP_PUBLIC_BASE_URL
        sync: false
      - key: QP_BACKEND_ALLOWED_ORIGINS
        sync: false
      # MUST be empty in production: a fixed signup code lets anyone verify any
      # address. See "Verification codes are currently static" in the README.
      - key: QP_VERIFICATION_STATIC_CODE
        value: ""
